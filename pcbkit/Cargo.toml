[workspace]
resolver = "2"
members = [
  "crates/pcbkit-core",
  "crates/pcbkit-route",
  "crates/pcbkit-assurance",
  "crates/pcbkit-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pcbkit-core = { path = "crates/pcbkit-core" }
pcbkit-route = { path = "crates/pcbkit-route" }
pcbkit-assurance = { path = "crates/pcbkit-assurance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
