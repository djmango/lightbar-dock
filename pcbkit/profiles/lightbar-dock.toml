# lightbar-dock routing profile — paths relative to repo root (cwd) or walked up from this file.
# No environment variables.
#
# Full manufacturing stack uses Freerouting on a KiCad Specctra DSN:
#   bun run board:make
# Circuit-json IR path uses lightbar-dock-circuit.toml (Topola).

engine = "freerouting"
topola_bin = "third_party/topola/target/release/topola"
freerouting_jar = "third_party/freerouting/freerouting-2.2.4.jar"
# Prefer repo-local JDK symlink (see scripts/ensure-java.mjs); falls back to PATH `java`.
java_bin = "third_party/java/bin/java"

topola_args = [
  "--multilayer",
  "--timeout-progress-bonus", "0",
  "--wall-timeout", "600",
]

freerouting_passes = 50

trace_width_mm = 0.15
via_diameter_mm = 0.6
via_drill_mm = 0.3
clearance_mm = 0.15

skip_nets = ["GND", "gnd"]

finish = true
finish_grid_mm = 0.1

# USB1 opens left: negative offset places flip vias outboard (toward the edge).
# Only repair usb_dp — Freerouting usually finishes usb_dm, and a second via
# column at the same X shorts D+/D− (0.5 mm pad pitch vs 0.6 mm vias).
[[repairs]]
type = "usb_c_flip_pads"
component = "USB1"
net = "usb_dp"
via_offset_mm = -2.0

[gate]
unconnected = 0
shorts = 0
